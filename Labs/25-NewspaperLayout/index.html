<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Newspaper Layout</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="newspaper-layout">
      <header class="title">
        <h1>The Daily Local News</h1>
      </header>
      <section>
        <article class="feature-article">
          <h2>Article</h2>
          <p>Article content</p>
        </article>
      </section>
      <section>
        <article class="small-article1">
          <h3>First Small Article</h3>
          <p>First small article content</p>
        </article>
        <article class="small-article2">
          <h3>Second Small Article</h3>
          <p>Second small article content</p>
        </article>
        <article class="small-article3">
          <h3>Third Small Article</h3>
          <p>Third small article content</p>
        </article>
        <article class="secondary-article">
          <h2>Secondary Article</h2>
          <p>Secondary article content</p>
        </article>
      </section>
    </main>
  </body>
</html>
