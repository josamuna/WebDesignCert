<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=content-width, initial-scale=1.0" />
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="container">
      <header id="header">
        <figure>
          <img
            src="https://cdn.freecodecamp.org/testable-projects-fcc/images/product-landing-page-logo.png"
            alt="Original Trombones Logo."
            id="header-img"
          />
        </figure>
        <nav id="nav-bar">
          <ul>
            <li class="nav-link"><a href="#Features">Features</a></li>
            <li class="nav-link"><a href="#How_It_Works">How It Works</a></li>
            <li class="nav-link"><a href="#Pricing">Pricing</a></li>
          </ul>
        </nav>
        <section id="Features">
          <form
            method="POST"
            action="https://www.freecodecamp.org/email-submit"
          >
            <label aria-hidden="true" for="email"></label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="Enter your email address"
            />
            <button type="submit">get started</button>
          </form>
        </section>

        <section id="How_It_Work">
          <iframe
            width="650"
            height="400"
            src="http://www.youtube-nocookie.com/embed/y8Yv4pnO7qc?rel=0&controls=0&showinfo=0"
            title="Peoples who playing musical instruments"
            frameborder="0"
            allow="
              accelerometer clipboard-write encrypted-media gyroscope picture-in-picture web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </section>

        <section id="Pricing"></section>
      </header>
    </main>
  </body>
</html>
